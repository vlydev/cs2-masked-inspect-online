<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Masked Inspect Decoder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css" />
  <style>
    :root {
      --mono: "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
      --pico-font-family: var(--mono);
    }

    /* lang dots */
    .lib-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .lang-py  { background: #3572a5; }
    .lang-js  { background: #f1e05a; }
    .lang-ts  { background: #3178c6; }
    .lang-php { background: #4f5d95; }
    .lang-cs  { background: #178600; }
    .lang-go  { background: #00add8; }
    .lang-rs  { background: #dea584; }
    .lang-kt  { background: #a97bff; }

    /* libs strip */
    .libs-strip { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.5rem; }
    .libs-strip a { font-size: .8rem; padding: .25rem .65rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); text-decoration: none; color: var(--pico-muted-color); }
    .libs-strip a:hover { border-color: var(--pico-primary); color: var(--pico-primary); }

    /* badges */
    .badge { display: inline-block; font-size: .7rem; padding: .1rem .45rem; border-radius: .2rem; border: 1px solid; }
    .badge-masked  { color: #4ec9b0; border-color: #4ec9b055; }
    .badge-hybrid  { color: #dcdcaa; border-color: #dcdcaa55; }
    .badge-classic { color: #ce9178; border-color: #ce917855; }

    /* value colours */
    .val-num   { color: #569cd6; }
    .val-float { color: #4ec9b0; }
    .val-gen   { color: #6a9955; font-size: .85rem; word-break: break-all; user-select: all; cursor: text; }

    /* table tweaks */
    table { font-size: .85rem; }
    th { font-weight: normal; color: var(--pico-muted-color); width: 9rem; }

    /* input row */
    .input-row { display: flex; gap: .5rem; }
    .input-row input { flex: 1; margin: 0; font-size: .85rem; }
    .input-row button { margin: 0; padding: .5rem 1rem; font-size: .85rem; width: auto; }

    footer { font-size: .8rem; margin-top: 2rem; }
  </style>
</head>
<body>

<main x-data="decoder()" @paste.window="onWindowPaste($event)">

  <hgroup>
    <h1>CS2 Masked Inspect Decoder</h1>
    <p>Offline · client-side · no data leaves your browser</p>
  </hgroup>

  <!-- Libraries -->
  <details open>
    <summary style="font-size:.8rem;color:var(--pico-muted-color)">Parsing libraries</summary>
    <div class="libs-strip" style="margin-top:.6rem">
      <a href="https://github.com/vlydev/cs2-masked-inspect-python" target="_blank" rel="noopener"><span class="lib-dot lang-py"></span>Python</a>
      <a href="https://github.com/vlydev/cs2-masked-inspect-js"     target="_blank" rel="noopener"><span class="lib-dot lang-js"></span>JavaScript</a>
      <a href="https://github.com/vlydev/cs2-masked-inspect-ts"     target="_blank" rel="noopener"><span class="lib-dot lang-ts"></span>TypeScript</a>
      <a href="https://github.com/vlydev/cs2-masked-inspect-php"    target="_blank" rel="noopener"><span class="lib-dot lang-php"></span>PHP</a>
      <a href="https://github.com/vlydev/cs2-masked-inspect-csharp" target="_blank" rel="noopener"><span class="lib-dot lang-cs"></span>C#</a>
      <a href="https://github.com/vlydev/cs2-masked-inspect-go"     target="_blank" rel="noopener"><span class="lib-dot lang-go"></span>Go</a>
      <a href="https://github.com/vlydev/cs2-masked-inspect-rust"   target="_blank" rel="noopener"><span class="lib-dot lang-rs"></span>Rust</a>
      <a href="https://github.com/vlydev/cs2-masked-inspect-kotlin" target="_blank" rel="noopener"><span class="lib-dot lang-kt"></span>Kotlin</a>
    </div>
  </details>

  <!-- Input -->
  <div class="input-row">
    <input
      type="text"
      x-model="url"
      @keydown.enter="decode"
      placeholder="csgo_econ_action_preview%20..."
      autocomplete="off"
      spellcheck="false"
    />
    <button @click="decode">Decode</button>
    <button @click="clear" class="secondary outline">Clear</button>
  </div>
  <small x-show="!error && !result" style="color:var(--pico-muted-color)">
    Supports masked, hybrid, and steam:// inspect links. Paste to auto-decode.
  </small>

  <!-- Error -->
  <article x-show="error" x-text="error" style="color:var(--pico-del-color);margin-top:.75rem"></article>

  <!-- Results -->
  <template x-if="result">
    <div>

      <h6 style="margin-bottom:.4rem">Item</h6>
      <figure>
        <table>
          <tbody>
            <tr><th>type</th>       <td x-html="linkTypeBadge()"></td></tr>
            <tr><th>defIndex</th>   <td class="val-num"  x-text="result.defIndex  ?? '—'"></td></tr>
            <tr><th>paintIndex</th> <td class="val-num"  x-text="result.paintIndex ?? '—'"></td></tr>
            <tr><th>paintSeed</th>  <td class="val-num"  x-text="result.paintSeed  ?? '—'"></td></tr>
            <tr><th>paintWear</th>  <td class="val-float" x-text="fmtFloat(result.paintWear)"></td></tr>
          </tbody>
        </table>
      </figure>

      <!-- Stickers -->
      <template x-if="result.stickers && result.stickers.length">
        <div>
          <h6 style="margin-bottom:.4rem">Stickers</h6>
          <figure>
            <table>
              <thead><tr><th style="width:4rem">Slot</th><th>ID</th><th>Wear</th></tr></thead>
              <tbody>
                <template x-for="(s, i) in result.stickers" :key="i">
                  <tr>
                    <td class="val-num"   x-text="s.slot ?? i"></td>
                    <td class="val-num"   x-text="s.id ?? s.stickerId ?? '—'"></td>
                    <td class="val-float" x-text="fmtFloat(s.wear)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </figure>
        </div>
      </template>

      <!-- Keychains -->
      <template x-if="result.keychains && result.keychains.length">
        <div>
          <h6 style="margin-bottom:.4rem">Keychains</h6>
          <figure>
            <table>
              <thead><tr><th>ID</th><th>Wear</th></tr></thead>
              <tbody>
                <template x-for="(k, i) in result.keychains" :key="i">
                  <tr>
                    <td class="val-num"   x-text="k.id ?? k.stickerId ?? '—'"></td>
                    <td class="val-float" x-text="fmtFloat(k.wear)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </figure>
        </div>
      </template>

      <!-- Gen code -->
      <h6 style="margin-bottom:.4rem">Gen Code</h6>
      <pre><code class="val-gen" x-text="genCode"></code></pre>

    </div>
  </template>

  <footer>
    <small>
      <a href="https://github.com/vlydev" target="_blank" rel="noopener">github.com/vlydev</a>
    </small>
  </footer>

</main>

<script src="https://github.com/vlydev/cs2-masked-inspect-js/releases/download/v1.1.1/cs2-masked-inspect.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script>
  const { InspectLink, toGenCode, genCodeFromLink } = Cs2MaskedInspect;

  document.addEventListener('alpine:init', () => {
    Alpine.data('decoder', () => ({
      url:     '',
      result:  null,
      genCode: '',
      error:   '',

      decode() {
        const u = this.url.trim();
        if (!u) return;
        this.error = '';
        try {
          this.result  = InspectLink.deserialize(u);
          try { this.genCode = genCodeFromLink(u); }
          catch { this.genCode = toGenCode(this.result); }
        } catch (e) {
          this.result  = null;
          this.genCode = '';
          this.error   = 'Failed to decode: ' + (e?.message ?? String(e));
        }
      },

      clear() {
        this.url = ''; this.result = null; this.genCode = ''; this.error = '';
        this.$nextTick(() => this.$el.querySelector('input')?.focus());
      },

      onWindowPaste(e) {
        const text = e.clipboardData?.getData('text') ?? '';
        if (!text) return;
        this.url = text;
        this.$nextTick(() => this.decode());
      },

      fmtFloat(f) {
        if (f == null) return '—';
        return Number(f).toFixed(10).replace(/0+$/, '').replace(/\.$/, '.0');
      },

      linkTypeBadge() {
        if (InspectLink.isMasked(this.url))  return '<span class="badge badge-masked">masked</span>';
        if (InspectLink.isClassic(this.url)) return '<span class="badge badge-classic">classic</span>';
        return '<span class="badge badge-hybrid">hybrid</span>';
      },
    }));
  });
</script>

</body>
</html>
